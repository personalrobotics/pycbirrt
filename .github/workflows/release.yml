name: Release

# Tag-driven release pipeline (#153), on the ssik pattern.
#
#   v*rc*              build wheels + sdist, publish to TestPyPI (the dry run)
#   v*                 build wheels + sdist, publish to PyPI, create the GitHub release from the CHANGELOG
#   workflow_dispatch  build wheels + sdist only; publishes to TestPyPI only with publish_testpypi=true
#
# Auth: Trusted Publishing (PyPI / TestPyPI OIDC). No API tokens. The publish jobs run inside the GitHub
# environments `release` and `testpypi-release` so environment-protection rules apply.
#
# The wheel matrix and the repair rules live in pyproject.toml under [tool.cibuildwheel]: CPython 3.10 to
# 3.14 on manylinux_2_28 x86_64 and macOS arm64, libmujoco excluded from bundling, every wheel installed
# with [mujoco,ssik] and run through the reference artifact check before it is kept.

on:
  push:
    tags: ["v*"]
    branches: [release-pipeline]  # TEMPORARY: exercise the build jobs on the PR branch; removed before merge
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Also publish the built artifacts to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.4.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the sdist
        run: uv build --sdist
      - name: The sdist compiles on a machine with no Eigen (the build downloads the pinned one)
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/sdist-env"
          uv pip install --python "$RUNNER_TEMP/sdist-env/bin/python" dist/*.tar.gz
          "$RUNNER_TEMP/sdist-env/bin/python" -c "import sscbirrt._native as n; assert n.has_ssik(), n.ssik_unavailable_reason(); print('sdist ok; SSIK adapter built against the downloaded Eigen')"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_testpypi:
    name: Publish to TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'rc')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_testpypi)
    environment:
      name: testpypi-release
      url: https://test.pypi.org/p/sscbirrt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Every artifact carries the tag's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"; ls -1 dist/
          for f in dist/*; do
            case "$(basename "$f")" in
              sscbirrt-"$TAG".tar.gz|sscbirrt-"$TAG"-*.whl) ;;
              *) echo "::error::$(basename "$f") is not version $TAG (pyproject version and tag must agree)"; exit 1 ;;
            esac
          done
          echo "OK: all artifacts are version $TAG"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')
    environment:
      name: release
      url: https://pypi.org/p/sscbirrt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Every artifact carries the tag's version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"; ls -1 dist/
          for f in dist/*; do
            case "$(basename "$f")" in
              sscbirrt-"$TAG".tar.gz|sscbirrt-"$TAG"-*.whl) ;;
              *) echo "::error::$(basename "$f") is not version $TAG (pyproject version and tag must agree)"; exit 1 ;;
            esac
          done
          echo "OK: all artifacts are version $TAG"
      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: GitHub release from the CHANGELOG
    needs: publish_pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          python3 - "$TAG" <<'PY' > notes.md
          import re, sys, pathlib
          tag = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not m:
              sys.exit(f"CHANGELOG.md has no section for {tag}")
          print(m.group(1).strip())
          PY
          test -s notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
