[project]
name = "pycbirrt"
version = "1.5.0"
description = "CBiRRT motion planner with TSR constraints"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
maintainers = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
dependencies = [
    "numpy>=1.24",
    "sstsr>=3.2,<4",  # import as `tsr`; 3.2 validates frames and bounds at construction (tsr.FRAME_ATOL), the shared contract with the native TSR
]

[project.optional-dependencies]
mujoco = ["mujoco==3.14.0"]  # exact: pycbirrt._native_mujoco is built against this MuJoCo and refuses another (docs/native-design.md, v1.7.0)
ssik = ["ssik>=7.0,<8"]  # 7.0 ships the ssik_cpp headers and ssik.cpp.joint_data for the native SSIK adapter (ssik#641)
eaik = ["eaik"]  # deprecated; removed in pycbirrt 2.0
examples = [
    "matplotlib",
    "mediapy",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.15,<0.16",  # formatter style only changes in minor releases; bump deliberately
    "hypothesis>=6.100",
]
all = ["pycbirrt[mujoco,ssik,eaik,examples,dev]"]

[build-system]
# ssik is a build requirement so the isolated build can ask it for the ssik_cpp CMake package
# (SSCBIRRT_WITH_SSIK=AUTO); without it the extension builds with the adapter disabled.
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "ssik>=7.0,<8", "mujoco==3.14.0"]
build-backend = "scikit_build_core.build"

# The C++ core under cpp/ is the primary build; the wheel reuses it with the Python
# target switched on. `pycbirrt` imports without the extension; backend="native" then
# reports it missing.
[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "cpp"
cmake.build-type = "Release"
cmake.define = { SSCBIRRT_BUILD_PYTHON = "ON", SSCBIRRT_BUILD_TESTS = "OFF", SSCBIRRT_INSTALL = "OFF" }
wheel.packages = ["src/pycbirrt"]
sdist.include = ["cpp/", "src/", "tests/", "tools/", "docs/"]

[project.urls]
Homepage = "https://github.com/personalrobotics/pycbirrt"
Repository = "https://github.com/personalrobotics/pycbirrt"
Issues = "https://github.com/personalrobotics/pycbirrt/issues"

[tool.ruff]
line-length = 120
# Newer ruff formats code blocks in Markdown; keep prose examples as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/pycbirrt/__init__.py" = ["F401"]
"src/pycbirrt/**/__init__.py" = ["F401"]
