[project]
name = "sscbirrt"
version = "2.0.0"
description = "CBiRRT: a motion planner over sets of starts, goals, and path constraints, with a C++ core and Task Space Regions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["motion-planning", "cbirrt", "rrt", "task-space-regions", "tsr", "manipulation", "robotics", "mujoco"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
maintainers = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
dependencies = [
    "numpy>=1.24",
    "sstsr>=3.2,<4",  # import as `tsr`; 3.2 validates frames and bounds at construction (tsr.FRAME_ATOL), the shared contract with the native TSR
]

[project.optional-dependencies]
mujoco = ["mujoco==3.14.0"]  # exact: sscbirrt._native_mujoco is built against this MuJoCo and refuses another (docs/native-design.md, v1.7.0)
ssik = ["ssik>=7.0,<8"]  # 7.0 ships the ssik_cpp headers and ssik.cpp.joint_data for the native SSIK adapter (ssik#641)
examples = [
    "matplotlib",
    "mediapy",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.15,<0.16",  # formatter style only changes in minor releases; bump deliberately
    "hypothesis>=6.100",
]
all = ["sscbirrt[mujoco,ssik,examples,dev]"]

[build-system]
# ssik is a build requirement so the isolated build can ask it for the ssik_cpp CMake package
# (SSCBIRRT_WITH_SSIK=AUTO); without it the extension builds with the adapter disabled.
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "ssik>=7.0,<8", "mujoco==3.14.0"]
build-backend = "scikit_build_core.build"

# The C++ core under cpp/ is the primary build; the wheel reuses it with the Python
# target switched on. `sscbirrt` imports without the extension; backend="native" then
# reports it missing.
[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "cpp"
cmake.build-type = "Release"
cmake.define = { SSCBIRRT_BUILD_PYTHON = "ON", SSCBIRRT_BUILD_TESTS = "OFF", SSCBIRRT_INSTALL = "OFF" }
wheel.packages = ["src/sscbirrt"]
sdist.include = ["cpp/", "src/", "tests/", "tools/", "docs/"]

[project.urls]
Homepage = "https://github.com/personalrobotics/sscbirrt"
Repository = "https://github.com/personalrobotics/sscbirrt"
Documentation = "https://github.com/personalrobotics/sscbirrt#readme"
Changelog = "https://github.com/personalrobotics/sscbirrt/blob/main/CHANGELOG.md"
Issues = "https://github.com/personalrobotics/sscbirrt/issues"

[tool.ruff]
line-length = 120
# Newer ruff formats code blocks in Markdown; keep prose examples as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/sscbirrt/__init__.py" = ["F401"]
"src/sscbirrt/**/__init__.py" = ["F401"]
