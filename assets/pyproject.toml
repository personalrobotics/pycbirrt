[project]
name = "sscbirrt-assets"
version = "1.0.0"
description = "The MuJoCo Menagerie UR5e and Robotiq 2F-85 models, packaged for the sscbirrt demos"
readme = "README.md"
requires-python = ">=3.10"
# The Python code is MIT; the model files keep their upstream licenses.
license = "MIT AND BSD-3-Clause AND BSD-2-Clause"
license-files = [
    "LICENSE",
    "src/sscbirrt_assets/menagerie/universal_robots_ur5e/LICENSE",
    "src/sscbirrt_assets/menagerie/robotiq_2f85/LICENSE",
]
keywords = ["mujoco", "ur5e", "robotiq", "robot-models", "sscbirrt"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
authors = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
dependencies = []

[project.urls]
Homepage = "https://github.com/personalrobotics/sscbirrt"
Source = "https://github.com/personalrobotics/sscbirrt/tree/main/assets"
Upstream = "https://github.com/google-deepmind/mujoco_menagerie"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The menagerie files are fetched at build time (hatch_build.py -> fetch.py, pinned and hash-checked) and
# gitignored, so they are declared as artifacts: hatchling otherwise drops VCS-ignored files.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sscbirrt_assets"]
artifacts = ["src/sscbirrt_assets/menagerie/**"]

[tool.hatch.build.targets.sdist]
include = ["src/", "fetch.py", "hatch_build.py", "manifest.json", "README.md", "LICENSE"]
artifacts = ["src/sscbirrt_assets/menagerie/**"]
